name: Lint

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true

jobs:
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Run golangci-lint
        run: |
          cd cli
          golangci-lint run
      - name: Install API Dependencies
        run: |
          cd apps/api
          pnpm install
      - name: Lint API
        run: |
          cd apps/api
          # Assuming there is a lint script, otherwise we might need to add one or run eslint directly
          if npm run | grep -q "lint"; then
            pnpm run lint
          else
            echo "No lint script found, skipping"
          fi
