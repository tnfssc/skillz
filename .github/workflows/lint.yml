name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: cli

  lint-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install API Dependencies
        run: |
          cd apps/api
          pnpm install
      - name: Lint API
        run: |
          cd apps/api
          # Assuming there is a lint script, otherwise we might need to add one or run eslint directly
          if npm run | grep -q "lint"; then
            pnpm run lint
          else
            echo "No lint script found, skipping"
          fi
