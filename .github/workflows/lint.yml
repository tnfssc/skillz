name: Lint

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true

jobs:
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Run golangci-lint
        run: |
          cd cli
          golangci-lint run

  lint-node:
    name: Lint Node Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install Dependencies
        run: pnpm install

      - name: Type Check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test API
        run: |
          cd apps/api
          if npm run | grep -q "test"; then
            pnpm run test
          else
            echo "No test script found for API"
          fi

      - name: Test Web
        run: |
          cd apps/web
          if npm run | grep -q "test"; then
            pnpm run test
          else
            echo "No test script found for Web"
          fi
