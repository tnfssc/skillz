name: "Release"

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true

jobs:
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build the executable
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd cli
          BINARY_NAME=skillz-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../$BINARY_NAME ./cmd/skillz
          ls -lh ../$BINARY_NAME

      - name: Package the executable
        if: ${{ ! (matrix.goos == 'windows' && matrix.goarch == 'arm64') }}
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          upx --best --lzma --force-macos skillz-*
          ls -lh skillz-*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillz-${{ matrix.goos }}-${{ matrix.goarch }}
          path: skillz-*
          if-no-files-found: error

  release:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/*
