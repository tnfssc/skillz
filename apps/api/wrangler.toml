name = "skillz-api"
main = "src/index.ts"
compatibility_date = "2024-11-18"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "skillz-registry"
database_id = "YOUR_D1_DATABASE_ID" # Replace after creating D1 database
migrations_dir = "../../packages/db/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "skillz-packages"

[[vectorize]]
binding = "VECTORIZE"
index_name = "skillz-embeddings"

[ai]
binding = "AI"

# Production Environment
[env.production]
name = "skillz-api-prod"
# routes = ["api.skillz.dev/*"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "skillz-registry-prod"
database_id = "PROD_D1_DATABASE_ID" # Replace with production DB ID
migrations_dir = "../../packages/db/migrations"

[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "skillz-packages-prod"

[env.production.vars]
ENVIRONMENT = "production"
